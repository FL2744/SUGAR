name: ARC classroom UX hotfix

on:
  push:
    branches:
      - release/classroom-v1.2.0
    paths:
      - ".github/workflows/arc-classroom-hotfix.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/classroom-v1.2.0
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply hotfix migration
        run: python tools/apply_arc_classroom_hotfix.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run regression suite
        run: |
          python -m pytest
          git diff --check
      - name: Commit tested hotfix
        run: |
          git config user.name "Alejandro Grenier"
          git config user.email "53024346+Jandro22@users.noreply.github.com"
          git add README.md docs/arc-quick-start.md pyproject.toml sugar_core/__init__.py sugar_bridge.py tests/test_public_opsec.py tests/test_arc_classroom_ux.py SUGAR-Windows/app.py SUGAR-macOS/Sources/LLMProvider.swift SUGAR-macOS/Sources/ContentView.swift SUGAR-macOS/Sources/AppModel.swift
          git commit -m "Improve ARC classroom onboarding and model support"
          git push origin HEAD:release/classroom-v1.2.0
