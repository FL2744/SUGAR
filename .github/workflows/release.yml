name: Tagged release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  python-distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - name: Verify tag/version/changelog agreement
        run: python tools/check_release.py "${GITHUB_REF_NAME}"
      - name: Build tagged distributions
        run: python -m build --sdist --wheel --no-isolation
      - name: Generate checksums and SBOM
        run: |
          cyclonedx-py requirements requirements/runtime.txt --output-format json --output-file dist/SUGAR-sbom.json
          sha256sum dist/* > dist/SHA256SUMS
      - name: Verify generated checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Attest exact release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
