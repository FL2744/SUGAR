name: Tagged cross-platform release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "RELEASE_VERSION"
  # "Cut release" starts a release this way; "rolling" is the automatic build of main (see rolling.yml).
  workflow_dispatch:
    inputs:
      mode:
        description: "release builds vX.Y.Z from the package version; rolling publishes the latest-main build"
        type: choice
        options: [release, rolling]
        default: release
  workflow_call:
    inputs:
      mode:
        type: string
        default: release

permissions:
  contents: write

jobs:
  release-context:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ctx.outputs.tag }}
      target: ${{ steps.ctx.outputs.target }}
      mode: ${{ steps.ctx.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - id: ctx
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'release' }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [[ "$MODE" == "rolling" ]]; then
            echo "tag=latest-main" >> "$GITHUB_OUTPUT"
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            version="$(python3 -c 'import re,pathlib; print(re.search(r"^__version__\s*=\s*\"([^\"]+)\"", pathlib.Path("sugar_core/__init__.py").read_text(), re.M).group(1))')"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            read -r tag target < RELEASE_VERSION
            test -n "$tag"
            test -n "$target"
            [[ "$tag" == v* ]]
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch origin "$target"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" "$target" -m "SUGAR ${tag#v}"
              git push origin "refs/tags/$tag"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "target=$target" >> "$GITHUB_OUTPUT"
          fi

  validate-release:
    needs: release-context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify tag and package version agree
        if: needs.release-context.outputs.mode != 'rolling'
        shell: bash
        run: |
          version="$(python -c 'import sugar_core; print(sugar_core.__version__)')"
          release_tag="${{ needs.release-context.outputs.tag }}"
          tag_version="${release_tag#v}"
          tag_version="${tag_version%%-*}"
          test "$tag_version" = "$version" || {
            echo "Release tag $release_tag does not match package version $version" >&2
            exit 1
          }
      - name: Run deterministic suite
        run: python -m pytest -q

  windows-x64:
    needs: [release-context, validate-release]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,windows]"
      - name: Stamp the build with its commit
        shell: bash
        run: python tools/write_build_info.py --commit "${{ needs.release-context.outputs.target }}" --mode "${{ needs.release-context.outputs.mode }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SUGAR-Desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build shared Windows application
        shell: pwsh
        run: .\SUGAR-Desktop\scripts\build-windows.ps1
      - name: Validate Windows installer and bridge
        shell: pwsh
        run: |
          $bridge = Resolve-Path .\SUGAR-Desktop\src-tauri\binaries\sugar-bridge-x86_64-pc-windows-msvc.exe
          $line = & $bridge diagnostics
          $payload = $line | ConvertFrom-Json
          if ($payload.event -ne "diagnostics") { throw "Expected diagnostics event" }
          if ($payload.bridge_protocol -ne 3) { throw "Unexpected desktop bridge protocol" }
          $installer = Get-ChildItem .\SUGAR-Desktop\src-tauri\target\release\bundle\msi -Filter *.msi | Select-Object -First 1
          if (-not $installer) { throw "Tauri Windows MSI missing" }
          if ($installer.Length -lt 1000000) { throw "Windows MSI is unexpectedly small" }
      - name: Validate no-credential State workflow
        shell: pwsh
        run: .\tools\smoke_packaged_no_credentials.ps1 -Bridge .\SUGAR-Desktop\src-tauri\binaries\sugar-bridge-x86_64-pc-windows-msvc.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: SUGAR-Desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  macos-apple-silicon:
    needs: [release-context, validate-release]
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Stamp the build with its commit
        shell: bash
        run: python tools/write_build_info.py --commit "${{ needs.release-context.outputs.target }}" --mode "${{ needs.release-context.outputs.mode }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SUGAR-Desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build macOS Apple Silicon application
        run: ./SUGAR-Desktop/scripts/build-macos.sh
      - name: Validate and archive Apple Silicon app
        run: |
          test "$(uname -m)" = "arm64"
          app="SUGAR-Desktop/src-tauri/target/release/bundle/macos/SUGAR.app"
          test -d "$app"
          bridge="$(find "$app" -type f -name 'sugar-bridge*' -perm -111 -print -quit)"
          test -n "$bridge"
          "$bridge" diagnostics
          sh tools/smoke_packaged_no_credentials.sh "$bridge"
          ditto -c -k --sequesterRsrc --keepParent "$app" SUGAR-macOS.zip
          test -s SUGAR-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-apple-silicon
          path: SUGAR-macOS.zip
          if-no-files-found: error

  python-distributions:
    needs: [release-context, validate-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel
      - uses: actions/upload-artifact@v7
        with:
          name: release-python
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    needs: [release-context, windows-x64, macos-apple-silicon, python-distributions]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release payload and checksums
        run: |
          ls release-assets/*.msi >/dev/null
          test -s release-assets/SUGAR-macOS.zip
          ls release-assets/*.whl >/dev/null
          ls release-assets/*.tar.gz >/dev/null
          (cd release-assets && sha256sum * > SHA256SUMS)
          (cd release-assets && sha256sum --check SHA256SUMS)
      - name: Write release notes
        env:
          MODE: ${{ needs.release-context.outputs.mode }}
          TARGET: ${{ needs.release-context.outputs.target }}
          TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          if [[ "$MODE" == "rolling" ]]; then
            {
              echo "Automatic build of the main branch. It passed the test suite; it is not a formal release."
              echo
              echo "commit: $TARGET"
              echo
              echo "The in-app updater uses this build for the Latest channel."
            } > RELEASE_NOTES.md
            exit 0
          fi
          cat > RELEASE_NOTES.md <<'EOF'
          SUGAR browser and optional desktop release.

          **Choose the file for your system:**
          - Windows 10/11 x64: the included SUGAR MSI installer
          - Mac: `SUGAR-macOS.zip` (Tauri app bundle)

          macOS desktop releases support Apple Silicon and target macOS 13 or newer. They are local-use builds; configure organization signing and notarization before public distribution. The Python wheel/source archive is included for CLI and development use.

          See `CHANGELOG.md` in the repository for release-specific fixes and methodology notes.
          EOF
          # Lead with this version's changelog section when it has one.
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["TAG"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## {re.escape(version)}\b.*?\n(.*?)(?=^## )", text, re.M | re.S)
          if m and m.group(1).strip():
              notes = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
              pathlib.Path("RELEASE_NOTES.md").write_text(m.group(1).strip() + "\n\n---\n\n" + notes, encoding="utf-8")
          PY
      - name: Create tag and publish GitHub release
        shell: bash
        run: |
          tag="${{ needs.release-context.outputs.tag }}"
          target="${{ needs.release-context.outputs.target }}"
          if [[ "${{ needs.release-context.outputs.mode }}" == "rolling" ]]; then
            # One rolling release: replace the previous build so the tag always points at the newest commit.
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --target "$target" \
              --title "Latest build" --notes-file RELEASE_NOTES.md --prerelease --latest=false
            exit 0
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "$target"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$target" -m "SUGAR ${tag#v}"
            git push origin "refs/tags/$tag"
          fi
          channel_flags="--latest"
          case "$tag" in
            *-rc*|*-beta*|*-preview*) channel_flags="--prerelease" ;;   # the in-app "Preview" channel
            *-lts*) channel_flags="--latest=false" ;;                    # long-term line; never replaces the stable release
          esac
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$target" \
            --title "SUGAR $tag" \
            --notes-file RELEASE_NOTES.md \
            $channel_flags
