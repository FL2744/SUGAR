name: One-time public OPSEC sanitization

on:
  push:
    branches:
      - chore/public-opsec-sanitization

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply target-neutral public refactor
        run: python tools/one_time_public_opsec_sanitize.py

      - name: Remove one-time automation from final tree
        run: |
          rm tools/one_time_public_opsec_sanitize.py
          rm .github/workflows/one-time-public-opsec-sanitize.yml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate public OPSEC guard
        run: python -m pytest -q tests/test_public_opsec.py

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit sanitized public tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No sanitization changes were required."
            exit 0
          fi
          git commit -m "Sanitize public target-specific references"
          git push origin HEAD:chore/public-opsec-sanitization
