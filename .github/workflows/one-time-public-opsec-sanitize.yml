name: One-time public OPSEC sanitization

on:
  push:
    branches:
      - chore/public-opsec-sanitization

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply target-neutral public refactor
        run: |
          python tools/one_time_public_opsec_sanitize.py
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          for path in root.glob('tests/test_kyrgyzstan*.py'):
              path.unlink()

          text_ext = {'.py','.md','.yml','.yaml','.toml','.txt','.swift','.ps1','.sh','.json','.html','.plist','.ini','.cfg'}
          exact = [
              ('_CHINA_TZ', '_PLATFORM_TZ'),
              ('china_russia_coordination', 'cross_state_coordination'),
              ('china_us_comparison', 'sponsor_us_comparison'),
              ('china_model', 'sponsor_model'),
              ('prc_observation', 'sponsor_observation'),
              ('prc_public_diplomacy', 'sponsor_public_diplomacy'),
              ('prc_government', 'sponsor_government'),
              ('prc_diplomatic_mission', 'sponsor_diplomatic_mission'),
              ('Confucius', 'Cultural exchange'),
              ('Luban', 'Technical training'),
          ]
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_ext:
                  continue
              if path.as_posix() in {'tools/one_time_public_opsec_sanitize.py', '.github/workflows/one-time-public-opsec-sanitize.yml'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              text = '\n'.join(line for line in text.splitlines() if 'kyrgyzstan_2026' not in line.casefold())
              if original.endswith('\n'):
                  text += '\n'
              for old, new in exact:
                  text = text.replace(old, new)
                  text = text.replace(old.upper(), new.upper())
              # Catch target tokens embedded beside underscores/dots as well as ordinary prose.
              text = re.sub(r'(?i)(?<![A-Za-z0-9])prc(?![A-Za-z0-9])', 'sponsor', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])china(?![A-Za-z0-9])', 'sponsor', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])chinese(?![A-Za-z0-9])', 'sponsoring-state', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])beijing(?![A-Za-z0-9])', 'capital-city', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])ccp(?![A-Za-z0-9])', 'ruling-party', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])cpc(?![A-Za-z0-9])', 'ruling-party', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])confucius(?![A-Za-z0-9])', 'cultural-exchange', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])luban(?![A-Za-z0-9])', 'technical-training', text)
              text = re.sub(r'(?i)(?<![A-Za-z0-9])kyrgyzstan(?![A-Za-z0-9])', 'example-host-country', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time automation from final tree
        run: |
          rm tools/one_time_public_opsec_sanitize.py
          rm .github/workflows/one-time-public-opsec-sanitize.yml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Validate public OPSEC guard
        run: python -m pytest -q tests/test_public_opsec.py

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Validate patch formatting
        run: git diff --check

      - name: Commit sanitized public tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No sanitization changes were required."
            exit 0
          fi
          git commit -m "Sanitize public target-specific references"
          git push origin HEAD:chore/public-opsec-sanitization
