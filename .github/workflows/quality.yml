name: Quality and reproducibility

on:
  push:
    branches: [main, "stabilize/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,security]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy focused core contract
        run: python -m mypy
      - name: Dependency audit
        run: python -m pip_audit --format columns

  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Deterministic tests and coverage gate
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m pytest -m "not live" --cov=sugar_core --cov=sugar_bridge --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  dependency-compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            track: minimum
            lock-file: requirements/runtime-min.txt
          - python-version: "3.13"
            track: latest
            lock-file: requirements/runtime.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install ${{ matrix.track }} runtime lock
        run: python -m pip install --require-hashes -r "${{ matrix.lock-file }}"
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pip check
      - name: Run compatibility suite
        run: python -m pytest -m "not live"

  platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/runtime.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pip check
      - name: Run cross-platform offline suite
        shell: bash
        run: python -m pytest --basetemp "${RUNNER_TEMP}/sugar-pytest" -m "not live"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m pip check
      - name: Build wheel and sdist
        run: python -m build --sdist --wheel --no-isolation
      - name: Install built wheel in an empty environment
        run: |
          python -m venv "$RUNNER_TEMP/sugar-wheel-venv"
          "$RUNNER_TEMP/sugar-wheel-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sugar-wheel-venv/bin/python" -m pip install --require-hashes -r requirements/runtime.txt
          "$RUNNER_TEMP/sugar-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/sugar-wheel-venv/bin/python" -c "import sugar_core; print(sugar_core.__version__)"
          "$RUNNER_TEMP/sugar-wheel-venv/bin/sugar" --help
      - name: Verify source archive contains package metadata
        run: tar -tf dist/*.tar.gz | grep -E '/(pyproject.toml|README.md)$'
      - name: Publish package validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  stress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run deterministic 5k storage stress probe
        run: python tools/stress_test.py --records 5000 --skip-map --max-seconds 120 --max-disk-mb 100 --output-dir "$RUNNER_TEMP/sugar-stress"
      - name: Verify stress report
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "sugar-stress/stress-report.json").read_text())
          assert report["network"] is False
          assert report["records"] == 5000
          assert report["budget_failures"] == []
          assert {result["name"] for result in report["results"]} >= {"harvest_store_upsert", "harvest_store_read"}
          PY
