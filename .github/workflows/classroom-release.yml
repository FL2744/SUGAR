name: Classroom desktop release

on:
  push:
    branches:
      - release/classroom-v1.2.0
    paths-ignore:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,windows]"
      - name: Build portable Windows application
        shell: pwsh
        run: .\SUGAR-Windows\scripts\build.ps1
      - name: Validate Windows bundle
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $line = & .\SUGAR-Windows\dist\SUGAR\sugar-bridge.exe diagnostics
          Write-Host $line
          $payload = $line | ConvertFrom-Json
          if ($payload.event -ne "diagnostics") { throw "Expected diagnostics event" }
          & .\SUGAR-Windows\dist\SUGAR\SUGAR.exe --smoke-test
          if (-not (Test-Path .\SUGAR-Windows\dist\SUGAR-Windows-x64.zip)) { throw "Portable Windows ZIP missing" }
          if ((Get-Item .\SUGAR-Windows\dist\SUGAR-Windows-x64.zip).Length -lt 1000000) { throw "Portable Windows ZIP is unexpectedly small" }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: SUGAR-Windows/dist/SUGAR-Windows-x64.zip
          if-no-files-found: error

  macos-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build macOS Apple Silicon application
        run: ./SUGAR-macOS/scripts/build_app.sh
      - name: Validate and archive Apple Silicon app
        run: |
          test "$(uname -m)" = "arm64"
          test -x SUGAR-macOS/.build-native/SUGAR.app/Contents/MacOS/SUGAR
          test -x SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge
          SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge diagnostics
          codesign --verify --deep --strict --verbose=2 SUGAR-macOS/.build-native/SUGAR.app
          ditto -c -k --sequesterRsrc --keepParent SUGAR-macOS/.build-native/SUGAR.app SUGAR-macOS-Apple-Silicon.zip
          test -s SUGAR-macOS-Apple-Silicon.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-apple-silicon
          path: SUGAR-macOS-Apple-Silicon.zip
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build macOS Intel application
        run: ./SUGAR-macOS/scripts/build_app.sh
      - name: Validate and archive Intel app
        run: |
          test "$(uname -m)" = "x86_64"
          test -x SUGAR-macOS/.build-native/SUGAR.app/Contents/MacOS/SUGAR
          test -x SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge
          SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge diagnostics
          codesign --verify --deep --strict --verbose=2 SUGAR-macOS/.build-native/SUGAR.app
          ditto -c -k --sequesterRsrc --keepParent SUGAR-macOS/.build-native/SUGAR.app SUGAR-macOS-Intel.zip
          test -s SUGAR-macOS-Intel.zip
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-intel
          path: SUGAR-macOS-Intel.zip
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [windows-x64, macos-apple-silicon, macos-intel]
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.2.1-classroom.1
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release payload
        run: |
          ls -lh release-assets
          test -s release-assets/SUGAR-Windows-x64.zip
          test -s release-assets/SUGAR-macOS-Apple-Silicon.zip
          test -s release-assets/SUGAR-macOS-Intel.zip
      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # SUGAR v1.2.1 Classroom Release

          Classroom hotfix prepared for September 17, 2026.

          ## ARC quick setup

          SUGAR now includes an in-app Virginia Tech ARC setup path. ARC's shared hosted-model API is available to Virginia Tech students, faculty, and staff with a personal API key from `llm.arc.vt.edu`; no separate ARC HPC account is required for the shared API.

          1. Open **Settings** in SUGAR.
          2. Use **Get ARC API Key** and sign in with Virginia Tech credentials.
          3. Create a personal API key under **User profile → Settings → Account → API keys**.
          4. Paste the key into SUGAR.
          5. Use **Test ARC Connection**.
          6. Select **Virginia Tech ARC** as the LLM provider for AI-assisted workflows.

          Bundled ARC model choices were refreshed against current ARC documentation: `gpt-oss-120b`, `DeepSeek-V4.1-Flash`, `GLM-5.3`, and `Kimi-K3`.

          ## Download the right file

          - **Windows 10/11 x64:** `SUGAR-Windows-x64.zip`
          - **Mac with Apple Silicon (M1/M2/M3/M4 and later):** `SUGAR-macOS-Apple-Silicon.zip`
          - **Intel Mac:** `SUGAR-macOS-Intel.zip`

          ## Windows

          Download the ZIP, extract the entire folder, then launch `SUGAR.exe`. Python is bundled and does not need to be installed separately.

          ## macOS

          Download the ZIP for your processor, unzip it, and open `SUGAR.app`. These classroom builds are ad-hoc signed rather than Apple-notarized, so the first launch may require Control-click/right-click → **Open** or **System Settings → Privacy & Security → Open Anyway**.

          The current macOS build target is macOS 13 or newer.
          EOF
      - name: Publish GitHub release
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "SUGAR v1.2.1 Classroom Release" \
            --notes-file RELEASE_NOTES.md
