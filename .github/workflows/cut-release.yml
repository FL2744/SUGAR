name: Cut release

# One click makes a formal release: bumps the version everywhere, rolls the changelog into release notes, commits to main,
# and starts the release build. Run it from the Actions tab (choose patch, minor or major).
# Set the repository variable AUTO_RELEASE to "true" to also cut a patch release every Monday when main has new commits.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "How big a change is this release?"
        type: choice
        options: [patch, minor, major]
        default: patch
  schedule:
    - cron: "17 14 * * 1"

concurrency:
  group: cut-release

permissions:
  contents: write
  actions: write

jobs:
  cut:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Anything new since the last release?
        id: news
        shell: bash
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [[ -n "$last" && "$(git rev-list --count "$last"..HEAD)" == "0" ]]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Nothing has changed since $last, so there is nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Bump version and roll the changelog
        if: steps.news.outputs.new == 'true'
        id: cut
        shell: bash
        run: |
          bump="${{ github.event.inputs.bump || 'patch' }}"
          result="$(python tools/cut_release.py "$bump" --notes-file RELEASE_NOTES_PREVIEW.md)"
          echo "$result"
          echo "tag=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["tag"])' "$result")" >> "$GITHUB_OUTPUT"
          rm -f RELEASE_NOTES_PREVIEW.md
      - name: Check the package still hangs together
        if: steps.news.outputs.new == 'true'
        run: |
          python -m pytest -q tests/test_integrity.py tests/test_release_tools.py
      - name: Commit to main
        if: steps.news.outputs.new == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ steps.cut.outputs.tag }}"
          git push origin HEAD:main
      - name: Start the release build
        if: steps.news.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=release
