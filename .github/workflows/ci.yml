name: CI

on:
  push:
    branches: [main, "stabilize/**", "fix/**", "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Import smoke test
        run: python -c "import sugar_core; print(sugar_core.__version__)"
      - name: Workspace smoke test
        run: python -c "import tempfile; from pathlib import Path; from sugar_core.workspace import SugarWorkspace; d=Path(tempfile.mkdtemp())/'project'; w=SugarWorkspace.create(d,name='CI'); p=w.path_for('raw')/'sample.txt'; p.write_text('ok',encoding='utf-8'); w.register_artifact('raw',p); assert SugarWorkspace.open(d).status()['artifact_count']==1"

  kyrgyzstan-e2e-case:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run real public-source Kyrgyzstan case
        run: python examples/cases/kyrgyzstan_2026/run_case.py --output "$RUNNER_TEMP/sugar-kyrgyzstan-2026" --clean
      - name: Verify fail-closed State outputs and analyst workspace
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "sugar-kyrgyzstan-2026"
          summary = json.loads((root / "outputs/reports/case-summary.json").read_text(encoding="utf-8"))
          findings = json.loads((root / "outputs/reports/case-findings.json").read_text(encoding="utf-8"))
          analyst = json.loads((root / "outputs/maps/kyrgyzstan_2026.analyst.html.metadata.json").read_text(encoding="utf-8"))
          verified = json.loads((root / "outputs/maps/kyrgyzstan_2026.verified.html.metadata.json").read_text(encoding="utf-8"))
          assert summary["observations"] == 11
          assert summary["human_verified_observations"] == 0
          assert summary["brief_eligible_assessments"] == 0
          assert summary["language_domain_fallbacks"] == 0
          assert summary["spurious_english_service_overlaps"] == 0
          assert summary["higher_ed_assessments"] > 0
          assert summary["higher_ed_missing_educationusa_service"] == 0
          assert summary["qualified_reach_assessments"] == 3
          assert summary["qualified_reach_missing_source_or_semantics"] == 0
          assert summary["qualified_reach_exact_total"] == 0
          assert summary["multi_site_observations"] == 1
          assert summary["structured_activity_locations"] == 2
          assert summary["us_sites_missing_precision"] == 0
          assert summary["analyst_map_observations"] == 11
          assert summary["analyst_map_locations"] == 12
          assert summary["analyst_map_multi_location_observations"] == 1
          assert summary["analyst_map_density_total_weight"] == 11.0
          assert summary["analyst_map_density_multi_location_observations"] == 1
          assert summary["verified_map_observations"] == 0
          assert summary["verified_map_locations"] == 0
          assert analyst["mapped_observations"] == 11
          assert analyst["mapped_locations"] == 12
          assert analyst["multi_location_observations"] == 1
          assert analyst["density_total_weight"] == 11.0
          assert analyst["density_multi_location_observations"] == 1
          assert verified["mapped_observations"] == 0
          assert verified["mapped_locations"] == 0
          assert analyst["mapped_us_sites"] == 8
          codes = {row["code"] for row in findings}
          assert codes >= {
              "language_education_domain_resolved",
              "direct_service_overlap_semantics_resolved",
              "virtual_educationusa_service_resolved",
              "us_site_precision_resolved",
              "qualified_reach_metric_resolved",
              "multi_site_observation_resolved",
              "human_review_gate_working",
          }
          assert "language_education_domain_gap" not in codes
          assert "direct_service_overlap_semantics_gap" not in codes
          assert "virtual_educationusa_service_gap" not in codes
          assert "us_site_precision_gap" not in codes
          assert "qualified_reach_metric_gap" not in codes
          assert "multi_site_observation_gap" not in codes
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
      - name: Publish reproducible Kyrgyzstan workspace
        uses: actions/upload-artifact@v4
        with:
          name: SUGAR-Kyrgyzstan-2026-E2E
          path: ${{ runner.temp }}/sugar-kyrgyzstan-2026
          if-no-files-found: error
          retention-days: 14

  weibo-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Bounded live public Weibo seed, qualification, and bulk-seed smoke
        env:
          SUGAR_LIVE_WEIBO: "1"
        run: python -m pytest -q -s tests/test_weibo_live.py tests/test_weibo_qualification_live.py tests/test_weibo_seed_harvest_live.py

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build packaged app
        run: ./SUGAR-macOS/scripts/build_app.sh
      - name: Inspect bundled architectures
        run: |
          lipo -archs SUGAR-macOS/.build-native/SUGAR.app/Contents/MacOS/SUGAR
          lipo -archs SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge
      - name: Verify bundled classroom samples
        run: |
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/Samples/example-spreadsheet.xlsx
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/Samples/example-map.html
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/Samples/example-analysis.pdf
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/Samples/classroom-preview.md
      - name: Backend diagnostics smoke test
        run: SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge diagnostics
      - name: Packaged analysis smoke test
        run: |
          cat > /tmp/sugar-smoke.csv <<'CSV'
          platform,native_id,published_at,author_handle,original_text,latitude,longitude,engagement
          bluesky,smoke-1,2026-09-10T12:00:00Z,tester,Smoke test,37.2296,-80.4139,"{""likes"": 1}"
          CSV
          cat > /tmp/sugar-analysis.json <<'JSON'
          {"source_file":"/tmp/sugar-smoke.csv","output_stem":"/tmp/sugar-smoke-report","output_format":"pdf"}
          JSON
          SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge analysis --config /tmp/sugar-analysis.json
          test -s /tmp/sugar-smoke-report.pdf
      - name: Verify bundle signature
        run: codesign --verify --deep --strict --verbose=2 SUGAR-macOS/.build-native/SUGAR.app
      - name: Package classroom DMG
        env:
          SUGAR_SKIP_APP_BUILD: "1"
        run: ./SUGAR-macOS/scripts/package_dmg.sh
      - name: Publish validated macOS classroom bundle
        uses: actions/upload-artifact@v4
        with:
          name: SUGAR-macOS-${{ runner.arch }}
          path: SUGAR-macOS/.build-native/SUGAR-*-unsigned.dmg
          if-no-files-found: error
          retention-days: 14

  windows-app:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,windows]"
      - name: Build single-file Windows application
        shell: pwsh
        run: .\SUGAR-Windows\scripts\build.ps1
      - name: Verify single-file artifact
        shell: pwsh
        run: |
          if (-not (Test-Path .\SUGAR-Windows\dist\SUGAR.exe)) { throw "SUGAR.exe missing" }
          if ((Get-Item .\SUGAR-Windows\dist\SUGAR.exe).Length -lt 1000000) { throw "SUGAR.exe is unexpectedly small" }
          $unexpected = Get-ChildItem .\SUGAR-Windows\dist -File | Where-Object { $_.Name -ne 'SUGAR.exe' }
          if ($unexpected) { throw "Windows distribution must contain only SUGAR.exe; found: $($unexpected.Name -join ', ')" }
      - name: Packaged GUI offscreen smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\SUGAR-Windows\dist\SUGAR.exe --smoke-test
      - name: Embedded backend diagnostics through GUI
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $proc = Start-Process -FilePath .\SUGAR-Windows\dist\SUGAR.exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Single-file GUI smoke test failed" }
      - name: Verify embedded bridge is present in one-file package
        shell: pwsh
        run: |
          # The final executable must be substantially larger than the separately frozen bridge,
          # demonstrating that the worker and GUI/runtime payload were embedded together.
          $gui = Get-Item .\SUGAR-Windows\dist\SUGAR.exe
          $bridge = Get-Item .\SUGAR-Windows\build\bridge-dist\sugar-bridge.exe
          if ($gui.Length -le $bridge.Length) { throw "SUGAR.exe does not appear to contain the embedded backend worker" }
      - name: Publish validated single-file Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SUGAR-Windows-x64-single-exe
          path: SUGAR-Windows/dist/SUGAR.exe
          if-no-files-found: error
          retention-days: 14
