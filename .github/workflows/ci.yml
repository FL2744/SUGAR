name: CI

on:
  push:
    branches: [main, "stabilize/**", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -c "import sugar_core; print(sugar_core.__version__)"

  compatibility-test:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exercise the older supported Python range cheaply on Linux, then
          # exercise 3.14 on both native desktop operating systems. The packaged
          # macOS app is validated separately on Python 3.12 because its frozen
          # runtime must retain the macOS 13 deployment floor.
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Import smoke test
        run: python -c "import sugar_core; print(sugar_core.__version__)"
      - name: Workspace smoke test
        run: python -c "import tempfile; from pathlib import Path; from sugar_core.workspace import SugarWorkspace; d=Path(tempfile.mkdtemp())/'project'; w=SugarWorkspace.create(d,name='CI'); p=w.path_for('raw')/'sample.txt'; p.write_text('ok',encoding='utf-8'); w.register_artifact('raw',p); assert SugarWorkspace.open(d).status()['artifact_count']==1"

  offline-stress-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Exercise a bounded 5,000-record checkpoint workload offline
        run: python tools/stress_test.py --records 5000 --skip-export --skip-map --output-dir "$RUNNER_TEMP/sugar-stress" --max-seconds 90 --max-disk-mb 256 --max-peak-python-mb 512

  macos-app:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The packaged macOS app deliberately embeds 3.12 so its frozen
          # backend and NumPy wheel retain the macOS 13 deployment floor.
          # Python 3.14 support is exercised by the cross-platform core matrix.
          python-version: "3.12"
          cache: pip
      - name: Build packaged app
        run: ./SUGAR-macOS/scripts/build_app.sh
      - name: Inspect bundled architectures
        run: |
          lipo -archs SUGAR-macOS/.build-native/SUGAR.app/Contents/MacOS/SUGAR
          lipo -archs SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge
      - name: Backend diagnostics smoke test
        run: SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge diagnostics
      - name: Packaged analysis smoke test
        run: |
          cat > /tmp/sugar-smoke.csv <<'CSV'
          platform,native_id,published_at,author_handle,original_text,latitude,longitude,engagement
          bluesky,smoke-1,2026-09-10T12:00:00Z,tester,Smoke test,37.2296,-80.4139,"{""likes"": 1}"
          CSV
          cat > /tmp/sugar-analysis.json <<'JSON'
          {"source_file":"/tmp/sugar-smoke.csv","output_stem":"/tmp/sugar-smoke-report","output_format":"pdf"}
          JSON
          SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge analysis --config /tmp/sugar-analysis.json
          test -s /tmp/sugar-smoke-report.pdf
      - name: Packaged no-credential research-project smoke test
        run: sh tools/smoke_packaged_no_credentials.sh SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/sugar-bridge
      - name: Verify bundle signature
        run: |
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/LICENSE
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/NOTICE
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          test -s SUGAR-macOS/.build-native/SUGAR.app/Contents/Resources/licenses/manifest.json
          codesign --verify --deep --strict --verbose=2 SUGAR-macOS/.build-native/SUGAR.app
      - name: Archive validated macOS bundle
        run: |
          test "$(uname -m)" = "arm64"
          ditto -c -k --sequesterRsrc --keepParent SUGAR-macOS/.build-native/SUGAR.app SUGAR-macOS.zip
          test -s SUGAR-macOS.zip
      - name: Publish validated macOS bundle
        uses: actions/upload-artifact@v7
        with:
          name: SUGAR-macOS
          path: SUGAR-macOS.zip
          if-no-files-found: error
          retention-days: 14

  windows-app:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e ".[dev,windows]"
      - name: Build portable Windows application
        shell: pwsh
        run: .\SUGAR-Windows\scripts\build.ps1
      - name: Packaged backend diagnostics
        shell: pwsh
        run: |
          $line = & .\SUGAR-Windows\dist\SUGAR\sugar-bridge.exe diagnostics
          Write-Host $line
          $payload = $line | ConvertFrom-Json
          if ($payload.event -ne "diagnostics") { throw "Expected diagnostics event" }
          if ($payload.bridge_protocol -ne 3) { throw "Unexpected desktop bridge protocol" }
          if ($payload.operations -notcontains "state-package") { throw "State desktop operations missing" }
          if ($payload.operations -notcontains "intel-synthesize") { throw "Intelligence desktop operations missing" }
          if ($payload.operations -notcontains "workspace-init") { throw "Workspace desktop operations missing" }
      - name: Packaged GUI offscreen smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\SUGAR-Windows\dist\SUGAR\SUGAR.exe --smoke-test
      - name: Packaged analysis smoke test
        shell: pwsh
        run: |
          @'
          platform,native_id,published_at,author_handle,original_text,latitude,longitude,engagement
          bluesky,smoke-1,2026-09-10T12:00:00Z,tester,Smoke test,37.2296,-80.4139,"{""likes"": 1}"
          '@ | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\sugar-smoke.csv
          @{ source_file = "$env:RUNNER_TEMP\sugar-smoke.csv"; output_stem = "$env:RUNNER_TEMP\sugar-smoke-report"; output_format = "pdf" } | ConvertTo-Json | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\sugar-analysis.json
          & .\SUGAR-Windows\dist\SUGAR\sugar-bridge.exe analysis --config $env:RUNNER_TEMP\sugar-analysis.json
          if (-not (Test-Path $env:RUNNER_TEMP\sugar-smoke-report.pdf)) { throw "Packaged analysis did not create a PDF" }
      - name: Typed State operation smoke test
        shell: pwsh
        run: |
          @{ output_file = "$env:RUNNER_TEMP\us-presence.csv" } | ConvertTo-Json | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\state-template.json
          & .\SUGAR-Windows\dist\SUGAR\sugar-bridge.exe state-template-us-sites --config $env:RUNNER_TEMP\state-template.json
          if (-not (Test-Path $env:RUNNER_TEMP\us-presence.csv)) { throw "Packaged State operation did not create output" }
      - name: Typed workspace operation smoke test
        shell: pwsh
        run: |
          @{ workspace = "$env:RUNNER_TEMP\sugar-project"; name = "CI Workspace" } | ConvertTo-Json | Set-Content -Encoding UTF8 $env:RUNNER_TEMP\workspace-init.json
          & .\SUGAR-Windows\dist\SUGAR\sugar-bridge.exe workspace-init --config $env:RUNNER_TEMP\workspace-init.json
          if (-not (Test-Path $env:RUNNER_TEMP\sugar-project\sugar-project.json)) { throw "Packaged workspace operation did not create manifest" }
      - name: Packaged no-credential research-project smoke test
        shell: pwsh
        run: .\tools\smoke_packaged_no_credentials.ps1 -Bridge .\SUGAR-Windows\dist\SUGAR\sugar-bridge.exe
      - name: Verify portable artifact
        shell: pwsh
        run: |
          if (-not (Test-Path .\SUGAR-Windows\dist\SUGAR-Windows-x64.zip)) { throw "Portable Windows ZIP missing" }
          if ((Get-Item .\SUGAR-Windows\dist\SUGAR-Windows-x64.zip).Length -lt 1000000) { throw "Portable Windows ZIP is unexpectedly small" }
          foreach ($legal in @("LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses\manifest.json", "third_party_licenses\qt\README.md", "third_party_licenses\qt\LGPL-3.0.txt", "third_party_licenses\qt\GPL-3.0.txt")) {
            if (-not (Test-Path (Join-Path ".\SUGAR-Windows\dist\SUGAR" $legal))) { throw "Missing legal artifact: $legal" }
          }
      - name: Publish validated portable Windows bundle
        uses: actions/upload-artifact@v7
        with:
          name: SUGAR-Windows-x64
          path: SUGAR-Windows/dist/SUGAR-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
