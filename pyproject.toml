[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-osint"
version = "1.2.0"
description = "SUGAR: repeatable public-source collection, evidence management, spatial analysis, and research workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "SUGAR contributors" }]
maintainers = [{ name = "SUGAR maintainers" }]
keywords = ["osint", "research", "social-media", "public-diplomacy", "data-provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "certifi>=2024.2",
  "chardet>=5.2,<6",
  "folium>=0.17,<1",
  "geopy>=2.4,<3",
  "langdetect>=1.0.9,<2",
  "matplotlib>=3.8,<4",
  "openai>=1.50,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<1",
  "mypy>=1.15,<3",
]
security = ["pip-audit>=2.10,<3"]
macos = ["pyinstaller>=6.10,<7"]
windows = ["PySide6>=6.8,<7", "pyinstaller>=6.10,<7"]
rtl = ["arabic-reshaper>=3,<4", "python-bidi>=0.6,<1"]

[project.scripts]
sugar = "sugar_core.cli:main"
sugar-project = "sugar_core.workspace_cli:console_main"
sugar-state = "sugar_core.state_cli:console_main"
sugar-intel = "sugar_core.state_intel_cli:console_main"

[project.urls]
Repository = "https://github.com/FL2744/SUGAR"
Issues = "https://github.com/FL2744/SUGAR/issues"
Homepage = "https://github.com/FL2744/SUGAR"
Documentation = "https://github.com/FL2744/SUGAR/tree/main/docs"
Changelog = "https://github.com/FL2744/SUGAR/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["sugar_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: bounded live public-source integration test; requires explicit opt-in",
  "stress: deterministic scale or resilience test; may take longer than the default suite",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["SUGAR-macOS/.build", "SUGAR-macOS/.build-native", "SUGAR-Windows/build", "SUGAR-Windows/dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["sugar_core", "sugar_bridge"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
fail_under = 75
show_missing = true

[tool.mypy]
python_version = "3.11"
follow_imports = "skip"
files = [
  "sugar_core/models.py",
  "sugar_core/observations.py",
  "sugar_core/collector_registry.py",
  "sugar_core/harvest.py",
  "sugar_core/workspace.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
