[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-osint"
version = "1.3.0"
description = "SUGAR: repeatable public-source collection, evidence management, spatial analysis, and research workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Alejandro Grenier"}]
requires-python = ">=3.11,<3.15"
keywords = ["osint", "research", "social-media", "public-diplomacy", "data-provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "certifi>=2024.2",
  "folium>=0.17,<1",
  "geopy>=2.4,<3",
  "langdetect>=1.0.9,<2",
  "matplotlib>=3.8,<4",
  "openai>=1.50,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3; python_version < '3.14'",
  "pandas>=2.3.3,<3; python_version >= '3.14'",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<6",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "packaging>=24,<27",
  "pytest>=8,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<1",
  "duckdb>=1.4,<2",
]
audit = ["pip-audit>=2.10,<3"]
analytics = ["duckdb>=1.4,<2"]
macos = ["pyinstaller>=6.15,<7"]
windows = ["PySide6>=6.8,<7", "pyinstaller>=6.15,<7"]
rtl = ["arabic-reshaper>=3,<4", "python-bidi>=0.6,<1"]

[project.scripts]
sugar = "sugar_core.cli:main"
sugar-project = "sugar_core.workspace_cli:main"
sugar-state = "sugar_core.state_cli:main"
sugar-intel = "sugar_core.state_intel_cli:main"

[project.urls]
Repository = "https://github.com/FL2744/SUGAR"
Issues = "https://github.com/FL2744/SUGAR/issues"

[tool.setuptools]
packages = ["sugar_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff.lint]
# Start with correctness-oriented Pyflakes checks. Expand this deliberately as
# historical style debt is cleaned rather than landing a repository-wide churn.
select = ["F"]

[tool.coverage.run]
branch = true
source = ["sugar_core"]

[tool.coverage.report]
show_missing = true
fail_under = 70
